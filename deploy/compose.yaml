services:
  neo4j:
    # Pinned to 4.4: the hasbolt driver speaks Bolt protocol v1-v3, which
    # Neo4j 5 dropped. 4.4 still serves Bolt v3, so the driver round-trips.
    # (Revisit if we move off hasbolt.)
    image: neo4j:4.4-community
    container_name: kakehashi-neo4j
    restart: unless-stopped
    # Reachable from this machine only. To expose the database on a network,
    # change the bindings in a compose override file and set a real password.
    ports:
      - "127.0.0.1:7474:7474"   # HTTP UI
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      # Initial password, set when the data volume is first created; the CLI
      # reads the same variable (KAKEHASHI_NEO4J_PASSWORD).
      NEO4J_AUTH: neo4j/${KAKEHASHI_NEO4J_PASSWORD:-changeme-on-first-run}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
      - ./neo4j/import:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-plugins:
